---
# ============================================================================
# 於 EC2 主機建置實驗執行環境
#
#   ansible-playbook provision.yml
#
# 本 playbook 為冪等：重複執行不會產生額外變更，
# 第二次執行的輸出應為 changed=0。
# ============================================================================

- name: Provision NBA prediction experiment environment
  hosts: experiment
  gather_facts: false

  vars:
    repo_url: "https://github.com/yuan3245/nba-prediction.git"
    project_dir: "/home/ubuntu/nba-prediction"
    python_version: "3.14"
    uv_bin: "/home/ubuntu/.local/bin/uv"

  tasks:
    # ------------------------------------------------------------------
    # 前置：EC2 開機後 cloud-init 仍在執行，此時 apt 資料庫被鎖定。
    # 未等待即操作 apt 會遭遇 "Could not get lock" 而失敗。
    # 使用 raw 模組是因為此階段尚未確認 Python 可用。
    # ------------------------------------------------------------------
    - name: Wait for cloud-init to complete
      ansible.builtin.raw: cloud-init status --wait
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    # ------------------------------------------------------------------
    # 系統套件
    # ------------------------------------------------------------------
    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system packages
      become: true
      ansible.builtin.apt:
        name:
          - git
          - curl
        state: present

    # ------------------------------------------------------------------
    # uv：用於安裝指定的 Python 版本
    #
    # Ubuntu 24.04 內建 Python 3.12，但論文環境為 3.14。
    # 以 uv 下載獨立的 3.14 執行檔，使雲端環境與本機一致，
    # 將「Python 版本」自變因清單中排除。
    # ------------------------------------------------------------------
    - name: Check whether uv is installed
      ansible.builtin.stat:
        path: "{{ uv_bin }}"
      register: uv_stat

    - name: Install uv
      ansible.builtin.shell: |
        set -o pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        executable: /bin/bash
      when: not uv_stat.stat.exists

    # ------------------------------------------------------------------
    # 專案原始碼
    #
    # 由 Git 取得而非自本機上傳：程式碼的單一事實來源是 repository，
    # 這也使雲端主機不需要任何本機檔案即可重建環境。
    # ------------------------------------------------------------------
    - name: Clone project repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
        depth: 1

    # ------------------------------------------------------------------
    # Python 環境
    # ------------------------------------------------------------------
    - name: Create virtual environment with pinned Python version
      ansible.builtin.command:
        cmd: "{{ uv_bin }} venv --python {{ python_version }}"
        chdir: "{{ project_dir }}"
        creates: "{{ project_dir }}/.venv/bin/python"

    - name: Install pinned dependencies
      ansible.builtin.command:
        cmd: "{{ uv_bin }} pip install -r requirements.txt"
        chdir: "{{ project_dir }}"
      environment:
        VIRTUAL_ENV: "{{ project_dir }}/.venv"
      register: pip_result
      changed_when: "'Installed' in pip_result.stdout"

    # ------------------------------------------------------------------
    # 驗證：確認實際安裝的版本與 requirements.txt 相符
    # ------------------------------------------------------------------
    - name: Collect installed package versions
      ansible.builtin.command:
        cmd: >-
          {{ project_dir }}/.venv/bin/python -c
          "import sys, pandas, numpy, sklearn, xgboost, scipy;
          print('python', sys.version.split()[0]);
          print('pandas', pandas.__version__);
          print('numpy', numpy.__version__);
          print('scikit-learn', sklearn.__version__);
          print('xgboost', xgboost.__version__);
          print('scipy', scipy.__version__)"
      register: versions
      changed_when: false

    - name: Report environment
      ansible.builtin.debug:
        msg: "{{ versions.stdout_lines }}"

    - name: Report host resources
      ansible.builtin.debug:
        msg: >-
          {{ ansible_processor_vcpus }} vCPU,
          {{ (ansible_memtotal_mb / 1024) | round(1) }} GB RAM,
          {{ ansible_distribution }} {{ ansible_distribution_version }}
